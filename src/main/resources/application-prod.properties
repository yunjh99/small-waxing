# Production database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Create and update the schema during the initial deployment.
# Replace this with a migration tool such as Flyway before scaling the service.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false

# Production rendering and restart behavior
spring.thymeleaf.cache=true
spring.devtools.restart.enabled=false

# Persistent upload directory on the server
app.upload.dir=${APP_UPLOAD_DIR:/data/waxing/uploads}

# Initial administrator account
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
