spring.application.name=waxing
server.port=8080

# MySQL ?? ?? ??
spring.datasource.url=jdbc:mysql://localhost:3306/waxing?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.thymeleaf.cache=false
spring.devtools.restart.enabled=true

# ?? ??? ?? ??
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=21MB

app.upload.dir=C:/data/waxingweb/uploads

# Reservation channels (override with environment variables in production)
app.reservation.naver-url=${NAVER_RESERVATION_URL:https://m.booking.naver.com/booking/13/bizes/1453729}
app.reservation.kakao-url=${KAKAO_CHANNEL_URL:https://pf.kakao.com/_mQxhxbG}
app.reservation.instagram-url=${INSTAGRAM_URL:https://www.instagram.com/small_waxing}

# Visitor analytics retention and daily cleanup
app.analytics.retention-days=365
app.analytics.cleanup-cron=0 20 3 * * *

# Initial administrator account (set through environment variables)
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
