<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/default-layout}">

<head>
    <title>FAQ</title>
    <meta name="description" content="스몰왁싱 FAQ 페이지">

    <th:block layout:fragment="pageCss">
        <link rel="stylesheet" th:href="@{/css/pages/community/faq/list.css}">
        <link rel="stylesheet" th:href="@{/css/pages/community/common.css}">
    </th:block>
</head>
<body>

<section layout:fragment="section-top">
    <div th:replace="~{fragments/community/community-hero :: hero('faq', '자주묻는질문', 'FAQ')}"></div>
</section>

<section layout:fragment="content">
    <div class="content">
        <div class="commu-list">

            <!-- 관리자용 탭 -->
            <div class="commu-tabs" sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/community/faqs(type=${selectedType})}"
                   th:classappend="${viewType == 'active'} ? 'is-active' : ''">
                    공개중
                </a>
                <a th:href="@{/admin/faqs(type=${selectedType}, viewType='deleted')}"
                   th:classappend="${viewType == 'deleted'} ? 'is-active' : ''">
                    삭제된
                </a>
            </div>

            <!-- 타입 필터 -->
            <div class="faq-types">

                <!-- 삭제된 탭 -->
                <th:block th:if="${viewType == 'deleted'}">
                    <a class="faq-type-card is-active"
                       th:href="@{/community/faqs(type='all', viewType='deleted')}">
                        <span class="faq-type-card__icon">ALL</span>
                        <span class="faq-type-card__text">전체</span>
                    </a>
                </th:block>

                <!-- 일반 탭 -->
                <th:block th:if="${viewType != 'deleted'}">

                    <a class="faq-type-card"
                       th:classappend="${selectedType == 'all'} ? ' is-active' : ''"
                       th:href="@{/community/faqs(type='all', viewType=${viewType})}">
                        <span class="faq-type-card__icon">ALL</span>
                        <span class="faq-type-card__text">전체</span>
                    </a>

                    <a class="faq-type-card"
                       th:classappend="${selectedType == 'reservation'} ? ' is-active' : ''"
                       th:href="@{/community/faqs(type='reservation', viewType=${viewType})}">
                        <span class="faq-type-card__text">예약문의</span>
                    </a>

                    <a class="faq-type-card"
                       th:classappend="${selectedType == 'service'} ? ' is-active' : ''"
                       th:href="@{/community/faqs(type='service', viewType=${viewType})}">
                        <span class="faq-type-card__text">서비스문의</span>
                    </a>

                    <a class="faq-type-card"
                       th:classappend="${selectedType == 'available'} ? ' is-active' : ''"
                       th:href="@{/community/faqs(type='available', viewType=${viewType})}">
                        <span class="faq-type-card__text">시술가능여부</span>
                    </a>

                    <a class="faq-type-card"
                       th:classappend="${selectedType == 'aftercare'} ? ' is-active' : ''"
                       th:href="@{/community/faqs(type='aftercare', viewType=${viewType})}">
                        <span class="faq-type-card__text">왁싱후관리</span>
                    </a>

                    <a class="faq-type-card"
                       th:classappend="${selectedType == 'business'} ? ' is-active' : ''"
                       th:href="@{/community/faqs(type='business', viewType=${viewType})}">
                        <span class="faq-type-card__text">업체문의</span>
                    </a>

                </th:block>

            </div>

            <!-- FAQ 목록 -->
            <div class="faq-list"
                 th:if="${faqs != null and !#lists.isEmpty(faqs.content)}">

                <div class="faq-item" th:each="faq : ${faqs.content}">
                    <div class="faq-item__question">
                        <button type="button" class="faq-item__question-main">
                            <div class="faq-item__left">
                <span class="faq-item__type"
                      th:if="${faq.type != null}"
                      th:text="${faq.type.label}">
                    예약문의
                </span>

                                <span class="faq-item__title"
                                      th:text="${faq.title}">
                    예약은 어떻게 하나요?
                </span>
                            </div>
                        </button>

                        <div class="faq-item__right">
                            <th:block sec:authorize="hasRole('ADMIN')">
                                <a th:if="${viewType != 'deleted'}"
                                   class="faq-item__edit"
                                   th:href="@{/admin/faqs/{id}/form(id=${faq.id})}">
                                    수정
                                </a>

                                <button type="button"
                                        class="faq-item__action"
                                        th:if="${viewType != 'deleted'}"
                                        th:attr="data-url=@{/admin/faqs/{id}/delete(id=${faq.id})},
                                 data-redirect=@{/community/faqs}"
                                        onclick="handleDelete(this)">
                                    삭제
                                </button>

                                <button type="button"
                                        class="faq-item__action"
                                        th:if="${viewType == 'deleted'}"
                                        th:attr="data-url=@{/admin/faqs/{id}/restore(id=${faq.id})},
                                 data-redirect=@{/community/faqs}"
                                        onclick="handleRestore(this)">
                                    복구
                                </button>
                            </th:block>

                            <!-- 펼침/접힘 버튼 -->
                            <button type="button" class="faq-item__toggle" aria-label="답변 열기">
                                +
                            </button>
                        </div>
                    </div>

                    <div class="faq-item__answer">
                        <div class="faq-item__answer-inner">
                            <div class="faq-item__content"
                                 th:text="${faq.content}">
                                홈페이지 또는 전화로 예약하실 수 있습니다.
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 빈 화면 -->
            <div class="faq-empty"
                 th:if="${faqs == null or #lists.isEmpty(faqs.content)}">
                등록된 FAQ가 없습니다.
            </div>

            <!-- 관리자 버튼 -->
            <div class="list-actions" sec:authorize="hasRole('ADMIN')">
                <a class="list-actions__btn" th:href="@{/admin/faqs/form}">
                    글쓰기
                </a>
            </div>
        </div>

        <!-- 페이지네이션 -->
        <nav class="pagination" th:if="${faqs != null and faqs.totalPages > 0}">
            <ul class="pagination__list">
                <li class="pagination__item"
                    th:classappend="${faqs.first} ? 'is-disabled'">
                    <a class="pagination__link" th:if="${faqs.first}" href="#">이전</a>
                    <a class="pagination__link" th:unless="${faqs.first}"
                       th:href="@{/community/faqs(type=${selectedType}, page=${faqs.number - 1})}">
                        이전
                    </a>
                </li>

                <li class="pagination__item is-active">
                    <span class="pagination__link" th:text="${faqs.number + 1}">1</span>
                </li>

                <li class="pagination__item"
                    th:classappend="${faqs.last} ? 'is-disabled'">
                    <a class="pagination__link" th:if="${faqs.last}" href="#">다음</a>
                    <a class="pagination__link" th:unless="${faqs.last}"
                       th:href="@{/community/faqs(type=${selectedType}, page=${faqs.number + 1})}">
                        다음
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <th:block layout:fragment="pageScript">
        <script th:src="@{/js/pages/community/faq/faq.js}" defer></script>
    </th:block>
</section>
</body>
</html>
