<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default-layout}">
<head>
    <title>로그인</title>

    <th:block layout:fragment="pageCss">
        <link rel="stylesheet" th:href="@{/css/pages/auth/login.css}">
    </th:block>
</head>

<section layout:fragment="content" class="login-page">
    <div class="login-card">
        <div class="login-card__intro">
            <span class="login-card__eyebrow">MEMBER ACCESS</span>
            <h1>로그인</h1>
            <p>스몰왁싱 관리자 서비스를 이용하려면<br>계정 정보를 입력해 주세요.</p>
        </div>

        <form class="login-form" th:action="@{/login}" method="post">
            <div class="login-form__field">
                <label for="username">아이디</label>
                <div class="login-form__input-wrap">
                    <i class="bi bi-person" aria-hidden="true"></i>
                    <input type="text"
                           id="username"
                           name="username"
                           autocomplete="username"
                           placeholder="아이디를 입력해 주세요"
                           required
                           autofocus>
                </div>
            </div>

            <div class="login-form__field">
                <label for="password">비밀번호</label>
                <div class="login-form__input-wrap">
                    <i class="bi bi-lock" aria-hidden="true"></i>
                    <input type="password"
                           id="password"
                           name="password"
                           autocomplete="current-password"
                           placeholder="비밀번호를 입력해 주세요"
                           required>
                </div>
            </div>

            <p class="login-form__error"
               role="alert"
               th:if="${param.error}">
                아이디 또는 비밀번호가 올바르지 않습니다.
            </p>

            <p class="login-form__message"
               role="status"
               th:if="${param.logout}">
                안전하게 로그아웃되었습니다.
            </p>

            <button type="submit" class="login-form__submit">
                로그인
                <i class="bi bi-arrow-right" aria-hidden="true"></i>
            </button>
        </form>
    </div>
</section>
</html>
