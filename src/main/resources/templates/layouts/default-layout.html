<!DOCTYPE html>
<!--
    모든 화면이 공통으로 사용하는 기본 레이아웃이다.
    각 페이지는 이 파일을 상속한 뒤 pageCss, section-top, content, pageScript 영역만 채운다.
    공통 구조를 한곳에서 관리하면 메뉴나 푸터를 수정할 때 모든 페이지를 일일이 고칠 필요가 없다.
-->
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8" />
    <title layout:title-pattern="예제왁싱 | $CONTENT_TITLE">예제왁싱</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{fragments/config :: configFragment}"></th:block>
    <th:block layout:fragment="pageCss"></th:block>
</head>

<body>

<nav th:replace="~{fragments/top-nav :: topNavFragment}"></nav>

<div class="layout-container">
    <aside class="sidebar"
           th:replace="~{fragments/side-nav :: sideNavFragment}">
    </aside>
    <div layout:fragment="section-top"></div>
    <main class="content-wrapper">
        <section layout:fragment="content"></section>
    </main>
</div>


<footer th:replace="~{fragments/footer :: footerFragment}"></footer>

<div th:replace="~{fragments/site-popup :: popup}"></div>

<!-- 모든 화면에서 공통으로 사용하는 알림 메시지 영역 -->
<div id="toast-container"
     class="toast-container"
     role="status"
     aria-live="polite"
     aria-atomic="true"></div>

<!-- 페이지별 JavaScript는 교체되는 content 영역 밖에서 불러와야 사라지지 않는다. -->
<th:block layout:fragment="pageScript"></th:block>

</body>
</html>
