<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--
  게시글 상세 화면 하단의 공통 작업 버튼 영역.
  각 URL은 이 프래그먼트를 호출하는 화면에서 게시글 유형에 맞게 전달한다.
  viewType은 호출부와의 인터페이스를 유지하기 위한 값이며, 현재 버튼 렌더링에는 사용하지 않는다.
-->
<th:block th:fragment="actions(listUrl, editUrl, restoreUrl, deleteUrl, restoreRedirectUrl, deleteRedirectUrl, viewType)">

  <div class="post-actions">
    <!-- 목록 버튼은 모든 사용자에게 노출한다. -->
    <a th:href="${listUrl}" class="btn">목록</a>

    <!-- 게시글 수정, 복구, 삭제 기능은 관리자에게만 노출한다. -->
    <th:block sec:authorize="hasRole('ADMIN')">
      <a th:href="${editUrl}" class="btn">수정</a>

      <!-- 처리 URL과 완료 후 이동할 URL을 JavaScript 이벤트 함수에 전달한다. -->
      <button type="button"
              class="btn"
              th:attr="data-url=${restoreUrl}, data-redirect=${restoreRedirectUrl}"
              onclick="handleRestore(this)">
        복구
      </button>

      <!-- 실제 삭제 요청과 후속 이동은 handleDelete 함수에서 처리한다. -->
      <button type="button"
              class="btn"
              th:attr="data-url=${deleteUrl}, data-redirect=${deleteRedirectUrl}"
              onclick="handleDelete(this)">
        삭제
      </button>
    </th:block>

  </div>

</th:block>
