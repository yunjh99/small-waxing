<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="popup"
     class="site-popup"
     th:if="${activePopups != null and !#lists.isEmpty(activePopups)}"
     sec:authorize="!hasRole('ADMIN')"
     data-site-popup hidden>
    <div class="site-popup__dialog" role="dialog" aria-modal="true" aria-label="예제왁싱 안내 팝업">
        <div class="site-popup__viewport">
            <div class="site-popup__track">
                <figure class="site-popup__slide" th:each="popup : ${activePopups}">
                    <img th:src="${popup.imageUrl}" th:alt="${popup.title}">
                </figure>
            </div>
            <div class="site-popup__dots" th:if="${#lists.size(activePopups) > 1}">
                <button type="button"
                        th:each="popup, stat : ${activePopups}"
                        th:classappend="${stat.first} ? ' is-active'"
                        th:attr="data-popup-index=${stat.index},aria-label=|${stat.index + 1}번째 팝업|"></button>
            </div>
        </div>

        <div class="site-popup__actions">
            <button type="button" data-popup-today>오늘 하루 안 보기</button>
            <button type="button" data-popup-close>닫기</button>
        </div>
    </div>
</div>
</body>
</html>
