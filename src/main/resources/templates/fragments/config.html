<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<!-- resources/templates/fragments/config.html -->

<th:block th:fragment="configFragment">


    <!-- 🔹 반응형 메타 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <!-- 🔹 favicon -->
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">

    <!-- Bootstrap Icons: bi bi-* classes used across the templates -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- 🔹 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/fragments/styles.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/top-nav.css(v='20260727-3')}">
    <link rel="stylesheet" th:href="@{/css/fragments/side-nav.css(v='20260727-3')}">
    <link rel="stylesheet" th:href="@{/css/fragments/footer.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/sectiontop.css(v='20260727-2')}">
    <link rel="stylesheet" th:href="@{/css/fragments/toast.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/site-popup.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/inline-image-editor.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/community/post-actions.css}"> <!-- ✅ 추가 -->
    <link rel="stylesheet" th:href="@{/css/fragments/community/list-actions.css}">

    <!-- Naver Map API 사용 -->
    <!-- 개인/일반 통합 -->
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=hsgujp2yff"></script>
    <script th:inline="javascript" type="text/javascript" th:src="@{/js/common/navermap.js}" defer></script>


    <script th:src="@{/js/fragments/top-nav.js(v='20260727-2')}" defer></script>
    <script th:src="@{/js/fragments/side-nav.js(v='20260727-2')}" defer></script>
    <script th:src="@{/js/fragments/toast.js}" defer></script>
    <script th:src="@{/js/fragments/site-popup.js}" defer></script>
    <script th:src="@{/js/fragments/inline-image-editor.js}" defer></script>
    <script th:src="@{/js/common/csrf.js}" defer></script>
    <script th:src="@{/js/fragments/community/list-actions.js}" defer></script>
    <script th:src="@{/js/fragments/community/post-actions.js}" defer></script>
    <!-- 🔹 공통 JS -->




</th:block>
