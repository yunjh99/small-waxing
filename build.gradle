plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'waxing'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'         // Spring MVC 웹 & REST API
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'   // Thymeleaf 템플릿 자동 매핑
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'    // JPA + Hibernate ORM
    runtimeOnly 'com.mysql:mysql-connector-j'                                 // MySQL JDBC 드라이버
    compileOnly 'org.projectlombok:lombok'                                    // Lombok(컴파일 시 적용)
    annotationProcessor 'org.projectlombok:lombok'                            // Lombok 애노테이션 처리
    testImplementation 'org.springframework.boot:spring-boot-starter-test'    // 테스트 지원
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'              // JUnit 실행 환경
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'         // Thymeleaf 공통 레이아웃 기능
    developmentOnly 'org.springframework.boot:spring-boot-devtools'           // 자동 리로딩 설정
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    testRuntimeOnly 'com.h2database:h2'


    // ✅ JPA/annotations 처리를 위해 필요(환경에 따라 꼭 필요)
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('compileJava', JavaCompile) {
    options.compilerArgs += [
            '-processor',
            'com.querydsl.apt.jpa.JPAAnnotationProcessor,lombok.launch.AnnotationProcessorHider$AnnotationProcessor'
    ]
}
